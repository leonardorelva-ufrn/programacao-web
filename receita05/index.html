<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Receita 05</title>
    </head>

    <body>
        <div><button id="botaoCarregar">Carregando cervejas</button></div>
        <div id="lista"></div>
    </body>

    <script>
        let cervejas = ["Guinness", "Desperados", "Becks"]

        //function carregar(){
        const carregarDiv = () => {
            const div = document.getElementById("lista")
            const cervejasHtml = cervejas.map(item => `<h1>${item}</h1>`)
            div.innerHTML = `${cervejasHtml.join("\n")}`
        }

        let botao = document.getElementById("botaoCarregar")
        botao.addEventListener("click", carregarDiv)

    </script>
</html>
