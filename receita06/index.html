<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Receita 06</title>
    </head>

    <body>
        <div><button id="botaoCarregar">Carregando cervejas...</button></div>
        <div id="cervejasDiv"></div>
    </body>

    <script>

        let cervejas = [

            {
                name : "Guinness",
                alcohol: "10%"
            },

            {
                name: "Desperados",
                alcohol: "6%"
            },

            {
                name: "Becks",
                alcohol: "5%"
            }

        ]

        const carregarDiv = cs => {
            const div = document.getElementById("cervejasDiv")
            const itensHtml = cs.map( item => `<tr><td>${item['name']}</td><td>${item['alcohol']}</td></tr>` )
            div.innerHTML = `
                <table border="1">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Álcool</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${itensHtml.join("\n")}
                    </tbody>
                </table>
            `
        }

        let botao = document.getElementById("botaoCarregar")
        botao.addEventListener("click", () => carregarDiv(cervejas) )  

    </script>
</html>
