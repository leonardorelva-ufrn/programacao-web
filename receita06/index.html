<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Receita 06</title>
    </head>

    <body>
        <div><button id="botaoCarregar">Carregando cervejas...</button></div>
        <div id="cervejasDiv"></div>
    </body>

    <script>

        let cervejas = [

            {
                name : "Guinness",
                alcohol: "10%",
                style: "Imperial Stout",
                ibu: "45"
            },

            {
                name: "Desperados",
                alcohol: "6%",
                style: "Lager",
                ibu: "20"
            },

            {
                name: "Becks",
                alcohol: "5%",
                style: "Pilsen",
                ibu: "25"
            }

        ]

        const carregarDiv = (
            cs,
            elementId = "cervejasDiv",
            headeres = ["Nome", "Álcool", "Estilo", "Amargor"],
            props = ["name", "alcohol", "style", "ibu"]
        ) => {

            const div = document.getElementById(elementId)
            const itensHtml = cs.map( item => `
                <tr>
                    ${props.map(p => `<td>${item[p]}</td>`).join("")}
                </tr>
            `)
            const thsHtml = headeres.map(h => `<th>${h}</th>`).join("")

            div.innerHTML = `
                <table border="1">
                    <thead>
                        <tr>
                            ${thsHtml}
                        </tr>
                    </thead>
                    <tbody>
                        ${itensHtml.join("\n")}
                    </tbody>
                </table>
            `
        }

        let botao = document.getElementById("botaoCarregar")
        botao.addEventListener("click", () => carregarDiv(cervejas)) 

    </script>
</html>
