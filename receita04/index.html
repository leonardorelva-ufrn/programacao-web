<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Site</title>
</head>
<body>
    <button id="botaoCarregar">Carregando sorvetes...</button> 
    <button id="botaoOrdenar">Mostrar sorvetes ordenadas</button>
    <button id="botaoEmbaralhar">Embaralhar sorvetes</button>

    <div id="meu amor"></div>            
</body>   
<script>

    let sorvetes = ["Chocolate", "Baunilha", "Morango", "Pistache"]

    function transformar(item){
        return `<tr><td>${item}</td></tr>`
    }

    //function carregarDiv(){
    const carregarDiv = (carrega) => {
        let div = document.getElementById("meu amor")
        let sorvetesHtml = carrega.map(transformar)
        div.innerHTML = `
            <table>
                <thead>
                    <tr><td>Nome da Cerveja</td></tr>
                </thead>
                <tbody>
                    ${sorvetesHtml.join("\n")}
                </tbody>
            </table>
        `
    }

    //function carregarOrdenamento(){
    const carregarOrdenamento = (ordena) => {
        ordena.sort()
        carregarDiv(ordena)
    }

    //function embaralharDiv(){
    const embaralharDiv = (embaralha) => {
        embaralha.sort(() => Math.random() -0.5)
        carregarDiv(embaralha)
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarDiv(sorvetes))
    
    let botaoOrdenar = document.getElementById("botaoOrdenar")
    botaoOrdenar.addEventListener("click", () => carregarOrdenamento(sorvetes))

    let botaoEmbaralhar = document.getElementById("botaoEmbaralhar")
    botaoEmbaralhar.addEventListener("click", () => embaralharDiv(sorvetes))
</script>
</html>
